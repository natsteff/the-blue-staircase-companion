<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e2435">
  <meta name="description" content="Sally’s Detective Notebook, the reading companion to The Blue Staircase.">
  <link rel="manifest" href="app.webmanifest">
  <link rel="icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Blue Staircase Notebook">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>The Blue Staircase · Sally’s Detective Notebook</title>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="masthead"><div class="shell brand">The Blue Staircase <span>Reading Companion</span></div></header>
  <main class="shell">
    <section class="intro" aria-labelledby="title">
      <a class="cover-link" href="https://github.com/natsteff/the-last-witness-companion#read-the-working-draft" aria-label="Read or download The Blue Staircase on GitHub">
        <img src="assets/the-last-witness-front-cover.jpg" alt="Current working-draft cover (previous title); replacement cover pending review" width="724" height="1086">
      </a>
      <div>
        <p class="eyebrow">A Mystery in Playa del Carmen</p>
        <h1 id="title">Sally’s Detective Notebook</h1>
      </div>
      <p class="lede">Practice the Spanish Sally encounters and follow the case one chapter at a time.</p>
    </section>
    <section class="notebook-options" aria-label="Notebook display options">
      <div class="chapter-picker">
        <label for="chapter">Your chapter</label>
        <select id="chapter" aria-describedby="selected-chapter-title" disabled></select>
        <p id="selected-chapter-title"></p>
      </div>
      <div class="reference-options">
        <label>Scope
          <select id="scope">
            <option value="chapter">This Chapter</option>
            <option value="through">Through Chapter 1</option>
          </select>
        </label>
        <label id="sort-option">Vocabulary order
          <select id="vocabulary-sort">
            <option value="story">Story Order</option>
            <option value="alphabetical">A–Z</option>
          </select>
        </label>
      </div>
      <div class="display-switches">
        <button id="hide-mastered" class="display-switch" type="button" role="switch"
          aria-checked="false" aria-label="Hide mastered vocabulary">
          <span aria-hidden="true">Show All</span>
          <span aria-hidden="true">Hide Mastered</span>
        </button>
        <button id="notes-font" class="display-switch" type="button" role="switch"
          aria-checked="false" aria-label="Use standard font for Case Notes">
          <span aria-hidden="true">Handwritten</span>
          <span aria-hidden="true">Standard Font</span>
        </button>
      </div>
    </section>
    <nav aria-label="Notebook sections">
      <button id="travelers" type="button" aria-pressed="false">Spanish Phrases for Travelers</button>
      <button id="spanish" type="button" aria-pressed="true">Spanish</button>
      <button id="case" type="button" aria-pressed="false">Case Notes</button>
    </nav>
    <p id="status" role="status">Opening notebook…</p>
    <section id="notebook" aria-label="Chapter notebook"></section>
    <footer>
      <p id="offline" role="status"></p>
      <p class="app-version">Blue Staircase Notebook v__APP_VERSION__ · Build __BUILD_REVISION__</p>
    </footer>
    <noscript>This notebook requires JavaScript.</noscript>
  </main>
</body>
</html>
